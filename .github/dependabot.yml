# Each Cloudhal release arrives as one PR bumping every @cloudhal/* package together: the fallback
# for the release PR cloudhal-dev/cloudhal opens here (with its cloudhal/template-check status),
# dependencies only (no theme). A person checks and merges it; merging deploys.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Istanbul
    allow:
      - dependency-name: "@cloudhal/*"
    groups:
      cloudhal:
        patterns: ["@cloudhal/*"]
    # Cloudhal's own releases install on the day they ship.
    cooldown:
      exclude: ["@cloudhal/*"]
    versioning-strategy: increase
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
